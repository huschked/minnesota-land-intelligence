name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline checks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Install constrained development dependencies
        run: python -m pip install -e ".[dev]" -c constraints-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Check Kanban consistency
        run: python scripts/render_kanban.py --check
      - name: Run default offline tests
        run: python -m pytest -q
      - name: Verify explicit live-test selection without executing it
        run: python -m pytest -m integration --collect-only -q
