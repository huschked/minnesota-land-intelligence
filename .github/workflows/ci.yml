name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * 1'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select CI coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - name: Check out complete diff history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select conservative coverage
        id: plan
        run: python scripts/ci_plan.py
  offline-checks:
    name: Offline checks (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Install constrained development dependencies
        run: python -m pip install -e ".[dev,ui,gis]" -c constraints-dev.txt
      - name: Verify pinned optional UI dependency
        run: python -c "import streamlit; assert streamlit.__version__ == '1.66.0'"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Check Kanban consistency
        run: python scripts/render_kanban.py --check
      - name: Run default offline tests
        run: python -m pytest -q --durations=20 --durations-min=0.1 --junitxml=test-results.xml
      - name: Verify explicit live-test selection without executing it
        run: python -m pytest -m integration --collect-only -q
  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [plan, offline-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out gate implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require successful selected checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECKS_RESULT: ${{ needs.offline-checks.result }}
        shell: bash
        run: python scripts/ci_plan.py --gate "$PLAN_RESULT" "$CHECKS_RESULT"
