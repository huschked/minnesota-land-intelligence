[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mn-land-intelligence"
version = "0.2.0"
description = "Authoritative Minnesota county parcel ingestion and screening"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
mn-land = "mn_land.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mn_land"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: accesses a live government service"]

[tool.ruff]
line-length = 100
target-version = "py311"
