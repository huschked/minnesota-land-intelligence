[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mn-land-intelligence"
version = "0.2.0"
description = "Authoritative Minnesota county parcel ingestion and screening"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]
ui = ["streamlit==1.66.0"]

[project.scripts]
mn-land = "mn_land.cli:main"
mn-land-viewer = "mn_land.ui.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mn_land"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-m", "not integration"]
testpaths = ["tests"]
markers = [
    "integration: accesses a live government service",
    "real_git: exercises real Git identity collection instead of the synthetic fixture",
    "ui: exercises the optional Streamlit shell (requires the ui extra)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
